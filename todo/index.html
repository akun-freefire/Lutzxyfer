
<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0c">
<title>To-Do List — Lutfyy</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #090a0c;
  --panel: #111214;
  --panel2: #191a1d;
  --text: #f4f4f6;
  --muted: #aeb0b8;
  --border: #303136;
  --red: #e50914;
  --red2: #ff3944;
}

body.light {
  color-scheme: light;
  --bg: #f5f6f8;
  --panel: #ffffff;
  --panel2: #f0f1f4;
  --text: #202127;
  --muted: #626571;
  --border: #d9dbe2;
  --red: #bd101b;
  --red2: #d71925;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Space Grotesk', sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 80% 0%, #3a090d 0, transparent 36%),
    var(--bg);
  transition: background .25s, color .25s;
}

body.light {
  background:
    radial-gradient(ellipse at 80% 0%, #ffdfdf 0, transparent 38%),
    var(--bg);
}

a {
  color: inherit;
  text-decoration: none;
}

button, input {
  font: inherit;
}

header {
  max-width: 1000px;
  margin: auto;
  padding: 24px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.brand {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -.04em;
}

.brand span, h1 span {
  color: var(--red2);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.theme, .back {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 999px;
  padding: 10px 14px;
  cursor: pointer;
}

.theme:hover, .back:hover {
  border-color: var(--red);
}

.wrap {
  max-width: 760px;
  margin: 44px auto;
  padding: 0 20px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--red2);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 14px var(--red);
}

h1 {
  font-size: clamp(2.5rem, 8vw, 4.6rem);
  letter-spacing: -.07em;
  line-height: 1;
  margin: 18px 0 12px;
}

.intro {
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 30px;
}

.app {
  padding: clamp(18px, 4vw, 30px);
  border: 1px solid var(--border);
  border-radius: 22px;
  background: var(--panel);
  box-shadow: 0 24px 70px #0002;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.topline h2 {
  font-size: 1.1rem;
  margin: 0;
}

.count {
  color: var(--muted);
  background: var(--panel2);
  padding: 7px 10px;
  border-radius: 999px;
  font-size: .8rem;
}

.form {
  display: flex;
  gap: 10px;
}

.form input {
  flex: 1;
  min-width: 0;
  padding: 14px 15px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel2);
  color: var(--text);
  outline: none;
}

.form input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px #e5091420;
}

.add {
  border: 0;
  border-radius: 12px;
  padding: 0 18px;
  background: var(--red);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.add:hover {
  background: var(--red2);
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.filter {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 8px 13px;
  cursor: pointer;
}

.filter.active {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}

.tasks {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 9px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px solid var(--border);
  background: var(--panel2);
  border-radius: 12px;
  animation: pop .22s ease;
}

.task input {
  accent-color: var(--red);
  width: 18px;
  height: 18px;
  flex: none;
}

.task span {
  flex: 1;
  overflow-wrap: anywhere;
}

.task.done span {
  text-decoration: line-through;
  color: var(--muted);
}

.delete {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 7px;
}

.delete:hover {
  background: #e509141a;
  color: var(--red2);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 28px 10px;
}

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  color: var(--muted);
  font-size: .82rem;
}

.clear {
  border: 0;
  background: transparent;
  color: var(--red2);
  cursor: pointer;
}

.foot {
  text-align: center;
  color: var(--muted);
  font-size: .82rem;
  margin: 28px 0 40px;
}

.foot a {
  color: var(--red2);
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(7px) scale(.99);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 520px) {
  header {
    padding: 18px 16px;
  }

  .wrap {
    margin: 28px auto;
    padding: 0 14px;
  }

  .form {
    flex-direction: column;
  }

  .add {
    padding: 13px;
  }

  .bottom {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>

<body>
<header>
  <a class="brand" href="../index.html">LUTFYY<span>.</span></a>
  <div class="actions">
    <a class="back" href="../index.html">← Portfolio</a>
    <button class="theme" id="theme" type="button">☀️ Terang</button>
  </div>
</header>

<main class="wrap">
  <div class="eyebrow"><span class="dot"></span> Productivity tool</div>
  <h1>Make it <span>happen.</span></h1>
  <p class="intro">
    Rencanakan hari, rapikan prioritas, lalu selesaikan satu per satu.
    Tugas tersimpan otomatis di browser kamu.
  </p>

  <section class="app">
    <div class="topline">
      <h2>Daftar tugas</h2>
      <span class="count" id="count">0 tugas</span>
    </div>

    <form class="form" id="form">
      <input id="taskInput" maxlength="180"
        placeholder="Apa yang ingin kamu kerjakan?"
        aria-label="Tugas baru" required>
      <button class="add" type="submit">＋ Tambah</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">Semua</button>
      <button class="filter" data-filter="active">Belum selesai</button>
      <button class="filter" data-filter="done">Selesai</button>
    </div>

    <ul class="tasks" id="tasks"></ul>

    <div class="bottom">
      <span id="remaining">Tidak ada tugas tersisa</span>
      <button class="clear" id="clear" type="button">
        Hapus tugas selesai
      </button>
    </div>
  </section>

  <p class="foot">
    Dibuat dengan ♥ oleh <a href="../index.html">Lutfyy</a>
    · <a href="../index.html#projects">Proyek lainnya</a>
  </p>
</main>

<script>
(() => {
  'use strict';

  const $ = selector => document.querySelector(selector);
  const form = $('#form');
  const input = $('#taskInput');
  const list = $('#tasks');
  const themeButton = $('#theme');

  let tasks = [];
  let filter = 'all';

  try {
    tasks = JSON.parse(localStorage.getItem('lutfyy-todo-v1') || '[]');
    if (!Array.isArray(tasks)) tasks = [];
  } catch {
    tasks = [];
  }

  function save() {
    try {
      localStorage.setItem('lutfyy-todo-v1', JSON.stringify(tasks));
    } catch {}
  }

  function render() {
    list.replaceChildren();

    const shown = tasks.filter(task =>
      filter === 'all' ||
      (filter === 'done' ? task.done : !task.done)
    );

    $('#count').textContent = `${tasks.length} tugas`;
    $('#remaining').textContent =
      `${tasks.filter(task => !task.done).length} tugas belum selesai`;

    if (!shown.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = tasks.length
        ? 'Tidak ada tugas pada filter ini.'
        : 'Belum ada tugas. Tambahkan tugas pertamamu!';
      list.append(empty);
    }

    shown.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!task.done;
      checkbox.setAttribute('aria-label', 'Tandai selesai');

      checkbox.addEventListener('change', () => {
        task.done = checkbox.checked;
        save();
        render();
      });

      const text = document.createElement('span');
      text.textContent = task.text;

      const remove = document.createElement('button');
      remove.className = 'delete';
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label', 'Hapus tugas');

      remove.addEventListener('click', () => {
        tasks = tasks.filter(item => item.id !== task.id);
        save();
        render();
      });

      li.append(checkbox, text, remove);
      list.append(li);
    });
  }

  form.addEventListener('submit', event => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    tasks.unshift({
      id: Date.now().toString(36) +
          Math.random().toString(36).slice(2, 7),
      text,
      done: false
    });

    save();
    input.value = '';
    render();
    input.focus();
  });

  document.querySelectorAll('.filter').forEach(button => {
    button.addEventListener('click', () => {
      filter = button.dataset.filter;

      document.querySelectorAll('.filter').forEach(item => {
        item.classList.toggle('active', item === button);
      });

      render();
    });
  });

  $('#clear').addEventListener('click', () => {
    tasks = tasks.filter(task => !task.done);
    save();
    render();
  });

  function setTheme(light) {
    document.body.classList.toggle('light', light);
    themeButton.textContent = light ? '🌙 Gelap' : '☀️ Terang';

    document.querySelector('meta[name="theme-color"]').content =
      light ? '#f5f6f8' : '#090a0c';

    try {
      localStorage.setItem('lutfyy-theme', light ? 'light' : 'dark');
    } catch {}
  }

  let light = false;

  try {
    light = localStorage.getItem('lutfyy-theme') === 'light';
  } catch {}

  setTheme(light);

  themeButton.addEventListener('click', () => {
    setTheme(!document.body.classList.contains('light'));
  });

  render();
})();
</script>
</body>
</html>
